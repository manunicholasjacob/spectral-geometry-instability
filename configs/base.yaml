# Base configuration for Spectral Geometry Instability project
# This file contains default values that can be overridden by experiment-specific configs

project:
  name: "spectral_geometry_instability"
  version: "0.1.0"
  seed: 42

data:
  start_date: "2005-01-01"
  end_date: "2024-12-31"
  price_field: "Adj Close"
  return_type: "log"  # "log" or "simple"
  max_missing_frac: 0.05
  cache_data: true

covariance:
  estimator: "sample"  # "sample", "ewma", "ledoit_wolf"
  rolling_window: 126
  ewma_span: 60
  min_periods: 60

geometry:
  top_k: 3
  sgi_variants:
    - "sgi"
    - "weighted_sgi"
    - "max_angle"
    - "mean_angle"
  compute_eigengap: true

targets:
  horizons:
    - 5
    - 10
    - 20
    - 60
  drawdown_threshold: 0.05
  correlation_spike_threshold: 0.7
  vol_spike_multiplier: 1.5

modeling:
  model_type: "linear"  # "linear", "logistic", "ridge", "lasso"
  train_years: 3
  test_years: 1
  min_train_obs: 252
  feature_sets:
    baseline_only:
      - "realized_vol"
      - "avg_correlation"
      - "market_return"
    sgi_only:
      - "sgi"
      - "weighted_sgi"
    baseline_plus_sgi:
      - "realized_vol"
      - "avg_correlation"
      - "market_return"
      - "sgi"
      - "weighted_sgi"
    full:
      - "realized_vol"
      - "avg_correlation"
      - "market_return"
      - "absorption_ratio"
      - "eigen_concentration"
      - "sgi"
      - "weighted_sgi"
      - "max_angle"

portfolio:
  strategies:
    - "equal_weight"
    - "inverse_vol"
    - "min_variance"
    - "sgi_conditioned_minvar"
  long_only: true
  sgi_threshold_percentile: 75
  shrinkage_alpha_low: 0.0
  shrinkage_alpha_high: 0.5

backtest:
  rebalance_frequency: "weekly"  # "daily", "weekly", "monthly"
  transaction_cost_bps: 10
  initial_capital: 1000000

outputs:
  base_dir: "outputs"
  save_figures: true
  save_tables: true
  save_predictions: true
  figure_format: "png"
  table_format: "csv"
